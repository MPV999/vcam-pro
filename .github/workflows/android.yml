name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not allowed inside a step-level `if:`, so the secret is
      # mapped to an env var once and the steps test that instead.
      VCAM_KEYSTORE_B64: ${{ secrets.VCAM_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository ships without a committed Gradle wrapper JAR (binary), so CI
      # provisions the Gradle distribution itself.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (JVM)
        run: |
          gradle \
            :core:common:testDebugUnitTest \
            :virtual-camera-sdk:format:testDebugUnitTest \
            :virtual-camera-sdk:frames:testDebugUnitTest \
            --stacktrace

      - name: Assemble debug APKs
        run: gradle :app:assembleDebug :integration-sample:assembleDebug --stacktrace

      - name: Decode signing key (only when secrets are configured)
        if: env.VCAM_KEYSTORE_B64 != ''
        run: |
          echo "$VCAM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vcam-release.jks"
          {
            echo "VCAM_KEYSTORE_PATH=$RUNNER_TEMP/vcam-release.jks"
            echo "VCAM_KEYSTORE_PASSWORD=${{ secrets.VCAM_KEYSTORE_PASSWORD }}"
            echo "VCAM_KEY_ALIAS=${{ secrets.VCAM_KEY_ALIAS }}"
            echo "VCAM_KEY_PASSWORD=${{ secrets.VCAM_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APKs and checksums
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          find integration-sample/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Only installable APKs go to the release. An unsigned release build cannot be
      # installed by Android, so the debug-signed APK is the one users actually download
      # until signing secrets are configured.
      - name: Stage installable APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/VCAM-Pro-debug.apk
          cp integration-sample/build/outputs/apk/debug/integration-sample-debug.apk \
             release-apks/VCAM-Integration-Sample-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/VCAM-Pro-release.apk
          fi
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vcam-apks
          path: artifacts/*
          if-no-files-found: error

      - name: Generate website release metadata
        run: |
          python3 - <<'PY'
          import json, os, hashlib, pathlib, datetime
          artifacts = pathlib.Path("artifacts")
          entries = []
          for apk in sorted(artifacts.glob("*.apk")):
              digest = hashlib.sha256(apk.read_bytes()).hexdigest()
              entries.append({
                  "name": apk.name,
                  "sizeBytes": apk.stat().st_size,
                  "sha256": digest,
              })
          payload = {
              "tag": os.environ.get("GITHUB_REF_NAME", "dev"),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "generatedAt": datetime.datetime.utcnow().isoformat() + "Z",
              "artifacts": entries,
          }
          pathlib.Path("website").mkdir(exist_ok=True)
          pathlib.Path("website/releases.json").write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-apks/*.apk release-apks/SHA256SUMS.txt \
            --title "VCAM PRO $GITHUB_REF_NAME" \
            --generate-notes

      - name: Commit website metadata
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/releases.json
          git commit -m "chore(website): release metadata for $GITHUB_REF_NAME" || exit 0
          git push origin HEAD:main || true

  instrumentation:
    name: Instrumentation tests (needs a device)
    runs-on: ubuntu-latest
    # Instrumentation tests need an emulator with a camera. Enable this job once a
    # self-hosted device runner is available; the GitHub-hosted emulator has no camera.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Connected tests
        run: gradle :app:connectedDebugAndroidTest --stacktrace

  pages:
    name: Deploy website to GitHub Pages
    needs: build
    # Pages must be enabled first (Settings -> Pages -> Source: GitHub Actions). Until then
    # this job is allowed to fail without turning the whole run red, because the APKs are
    # what matters here.
    continue-on-error: true
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
